id: ch5_material_mixtures
title: "Two-phase drone materials: effective conductivity, load sharing and Joule heating"
domain: engineering
level: ME 244
chapter: "5"
summary: >
  A binder doped with conducting particles conducts somewhere between two Hashin–Shtrikman bounds that depend
  only on the phase conductivities σ₁ᶜ, σ₂ᶜ and the particle fraction v₂ᶜ; the microstructure parameter φᶜ
  (how much the particles touch) places the estimate σ^c,* between them. C_E,2 and C_J,2 scale the RVE averages
  into particle averages, so v₂ᶜC_E,2 and v₂ᶜC_J,2 are the particles' shares of the field and of the current
  (eq. 5.24), and the products C_J,iC_E,i give the mean-field Joule heating intensity in each phase relative to
  ⟨J⟩·⟨E⟩. The time evolution is a lumped form of the first law (eq. 5.25), constructed for this figure: at a
  fixed drive current ⟨J⟩ the mixture's Joule heat ⟨J⟩²/σ^c,* warms it against a convective loss h_v, so the
  steady temperature rise is inversely proportional to σ^c,* (under a fixed field ⟨E⟩ it would be proportional
  instead) — the chapter itself is static and does the trade-off through the cost function Π.
notes:
  - "The two bounds of eq. 5.9 work from opposite ends: σ^c,*,− is σ₁ᶜ plus a positive correction that grows with v₂ᶜ, and σ^c,*,+ is σ₂ᶜ minus a correction (−769 1/(Ω·m) at the defaults) that vanishes as v₂ᶜ → 1, so both rise with v₂ᶜ. With the matrix outside (σ^c,*,−) the gain is throttled by (1−v₂ᶜ)/(3σ₁ᶜ) = 0.023, which dominates 1/(σ₂ᶜ−σ₁ᶜ) = 0.001, so the lower bound barely depends on σ₂ᶜ (elasticity 0.02). At the defaults the bounds differ ten-fold (≈ 22 vs ≈ 231 1/(Ω·m)), the gap widens as the contrast σ₂ᶜ/σ₁ᶜ grows, and φᶜ — how much the particles touch — decides where σ^c,* falls between them."
  - "Load sharing is an identity: v₁ᶜC_J,1 + v₂ᶜC_J,2 = 1 (eq. 5.23) for any σ^c,*. At φᶜ = 0.4 the particles, 30 % of the volume, carry ≈ 91 % of the current (v₂ᶜC_J,2 = 0.3 × 3.05) but only ≈ 10 % of the field (C_E,2 ≈ 0.32, while the binder sees C_E,1 ≈ 1.29 times the mean field): the field crowds into the binder gaps while the current crowds into the particles. With fully isolated particles (φᶜ = 0, the lower bound) their current share falls to ≈ 56 %, so the 91 % reflects φᶜ as much as the contrast σ₂ᶜ/σ₁ᶜ = 100."
  - "The per-phase Joule factors C_J,iC_E,i are the products of eqs. 5.30 and 5.31, (σᵢᶜ/σ^c,*)(1/vᵢᶜ²)(…)² — eqs. 5.32–5.33 as extracted print a single 1/vᵢᶜ, which would give 0.11 and 0.29. They are intensities, not shares: at the defaults the particles run at 0.98 and the binder at 0.16 of ⟨J⟩·⟨E⟩, and v₁ᶜ(0.16) + v₂ᶜ(0.98) ≈ 0.41 ≠ 1. Built from phase-averaged fields (eqs. 5.28–5.29), they miss the heat from field fluctuations inside each phase, while the lumped model heats with the exact total ⟨J⟩·⟨E⟩ = ⟨J⟩²/σ^c,*. Isolate the particles (φᶜ = 0) and the ranking flips (binder 0.89, particles 0.08), which is why Π^elec needs a tolerance TOL_i for each phase."
  - "At fixed ⟨J⟩ (a current-driven part), Δθ_∞ = ⟨J⟩²/(σ^c,* h_v) has elasticity −1 in σ^c,* and +2 in ⟨J⟩: locally, each per cent of σ^c,* lost is a per cent more heat. Under a fixed field or voltage the source would be σ^c,*⟨E⟩² and Δθ_∞ ∝ σ^c,* instead, so 'less conductive means hotter' holds only for current drive. ρc/h_v = 90 s sets both the heat-up and the cool-down once the current is cut."
  - "Cutting v₂ᶜ by 30 % (φᶜ fixed) lowers σ^c,* from 106 to 74 1/(Ω·m) (−30 %) and raises Δθ_∞ from 189 to 269 K (+42 %), so the 100 K limit arrives at 42 s instead of 68 s; the particle current concentration C_J,2 rises from 3.05 to 4.16, the particle Joule factor from 0.98 to 1.29 (past a tolerance TOL₂ = 1) and the absolute particle heating from 3.7 to 6.9 MW/m³. The chain-reaction panel adds linearised (elasticity) contributions, so its sizes are first-order only (it shows Δθ_∞ ≈ +31 % and C_J,2C_E,2 ≈ +23 % against the exact +42 % and +31 %). At this current only a well-connected microstructure (φᶜ ≥ 0.85, σ^c,* ≥ 200 1/(Ω·m)) stays below 100 K."
  - "Π^elec = w₁|σ^c,*,Des − σ^c,*|/σ^c,*,Des + ŵ₂|C_J1C_E1 − TOL₁|/TOL₁ + ŵ₃|C_J2C_E2 − TOL₂|/TOL₂ switches ŵ₂, ŵ₃ on only when a tolerance is violated (eq. 5.38). The switches and the |·| make Π non-differentiable, and Π is also nonconvex in Λ (§5.11 (I)–(II)), so the chapter minimises Π^total = W₁Π^elec + W₂Π^thermal + W₃Π^mech (eq. 5.59) with the genetic algorithm of §5.12 rather than Newton's method. Π^elec itself is not computed here; the two Joule-factor nodes are the quantities its TOL_i test."
sources:
  - "Zohdi, Modeling, simulation and digital-twins of multi-drone systems (ME 244 primer, 2026 draft), §5.1 Hashin–Shtrikman bounds and the φᶜ estimate (eqs. 5.9–5.10), §5.2–5.3 concentration tensors and load sharing (eqs. 5.11–5.24), §5.4 Joule heating (eqs. 5.25–5.37), §5.5 electrical cost function (eq. 5.38), §5.6 thermal cost function and bounds (eqs. 5.39–5.40), §5.7–5.10 mechanical bounds, stress concentrations and cost (eqs. 5.41–5.58), §5.11–5.12 Π^total (eq. 5.59) and the genetic algorithm."
variables:
  - id: sigma1
    name: Matrix (binder) conductivity
    symbol: σ₁ᶜ
    unit: "1/(Ω*m)"
    kind: parameter
    default: 10
    range: [0.1, 50]
    description: "Phase 1 is the continuous binder; eq. 5.9 assumes σ₂ᶜ ≥ σ₁ᶜ (§5.1), so this range stays below σ₂ᶜ's. The default is an illustrative intrinsically conductive (e.g. carbon-loaded) binder, not a value from the chapter; a true polymer dielectric has σ ≲ 1e-10 1/(Ω·m)."
  - id: sigma2
    name: Particle conductivity
    symbol: σ₂ᶜ
    unit: "1/(Ω*m)"
    kind: parameter
    default: 1000
    range: [100, 100000]
    description: "Phase 2 is the dispersed conducting particles (dopants), a design variable in Λ = {σ₂ᶜ, σ₁ᶜ, v₂ᶜ} (§5.5). The default (carbon-type particles, contrast σ₂ᶜ/σ₁ᶜ = 100) is illustrative; real dopant/binder contrasts are ≥ 1e6, which widens the gap between the bounds much further."
  - id: v2
    name: Particle volume fraction
    symbol: v₂ᶜ
    unit: "1"
    kind: parameter
    default: 0.3
    range: [0.02, 0.6]
    description: "Fraction of the RVE occupied by phase 2; v₁ᶜ = 1 − v₂ᶜ (eq. 5.11)."
  - id: phi
    name: Microstructure (contact) parameter
    symbol: φᶜ
    unit: "1"
    kind: parameter
    default: 0.4
    range: [0, 1]
    description: "Weight of the upper bound in σ^c,* ≈ φᶜσ^c,*,+ + (1−φᶜ)σ^c,*,− (eq. 5.10), calibrated against experiment: φᶜ = φ_s ≤ 1/2 for isolated spheres at low fraction (< 15 %); flakes touch more, so φ_f > φ_s (trend: φᶜ > 1/2 when the upper bound is the better estimate). The default 0.4 is illustrative and held fixed here, so the v₂ᶜ shock does not change it; §5.1 ties non-touching spheres to low fractions, so a much sparser mix would likely also need a lower φᶜ."
  - id: J
    name: Macroscopic current density
    symbol: "⟨J⟩_Ω"
    unit: A/m^2
    kind: parameter
    default: 20000
    range: [0, 30000]
    description: "Volume-averaged current driven through the component and held fixed (a current-driven part); the Joule source is H = a(J·E) with a = 1 (eq. 5.25). Capped at 30 kA/m² because the lumped model is linear."
  - id: rho_cp
    name: Volumetric heat capacity
    symbol: ρc
    unit: J/(m^3*K)
    kind: constant
    default: 1.8e6
    description: "ρ times the specific heat behind the stored-energy term ρẇ of eq. 5.25 (a filled polymer: 1500 kg/m³ × 1200 J/(kg·K))."
  - id: h_v
    name: Volumetric heat-loss coefficient
    symbol: h_v
    unit: W/(m^3*K)
    kind: parameter
    default: 20000
    range: [10000, 200000]
    description: "Convective loss per unit volume and kelvin (h·A/V), the lumped stand-in for ∇·q in eq. 5.25; a thin strip in the rotor downwash. More loss always means a cooler part."
  - id: theta
    name: Temperature rise above ambient
    symbol: Δθ
    unit: K
    kind: state
    default: 0
    range: [0, 500]
    description: "Mixture temperature above the surroundings; obeys ρc dΔθ/dt = ⟨J⟩²/σ^c,* − h_v Δθ (lumped eq. 5.25). The model is linear (no σ(θ), no degradation), so values far past the 100 K limit only say the part would fail. The arrow from ρc is − only while heating: after the current is cut a larger ρc keeps the part hotter for longer."
  - id: q_J
    name: Joule heat source
    symbol: "H = ⟨J⟩²/σ^c,*"
    unit: W/m^3
    kind: derived
    equation: J**2/sigma_eff
    description: "Heat generated per unit volume, H = ⟨J⟩·⟨E⟩ = ⟨J⟩²/σ^c,* (eq. 5.25 with a = 1); by Hill's condition, assumed for the RVE, this is also the exact mean ⟨J·E⟩ including the fluctuations inside each phase. At fixed ⟨J⟩ it falls as σ^c,* rises; at fixed ⟨E⟩ it would be σ^c,*⟨E⟩² and rise instead."
  - id: theta_ss
    name: Steady-state temperature rise
    symbol: Δθ_∞
    unit: K
    kind: derived
    equation: q_J/h_v
    description: "Where the Joule heat and the loss h_vΔθ balance; at fixed ⟨J⟩ it is ⟨J⟩²/(σ^c,* h_v), inversely proportional to the effective conductivity. It drops to zero when the current is cut."
  - id: sigma_lo
    name: Hashin–Shtrikman lower bound
    symbol: "σ^c,*,−"
    unit: "1/(Ω*m)"
    kind: derived
    equation: sigma1 + v2/(1/(sigma2 - sigma1) + (1 - v2)/(3*sigma1))
    description: "Left side of eq. 5.9: σ₁ᶜ plus a positive correction that grows with v₂ᶜ; accurate when conducting particles are isolated by the binder (case 1)."
  - id: sigma_hi
    name: Hashin–Shtrikman upper bound
    symbol: "σ^c,*,+"
    unit: "1/(Ω*m)"
    kind: derived
    equation: sigma2 + (1 - v2)/(1/(sigma1 - sigma2) + v2/(3*sigma2))
    description: "Right side of eq. 5.9: σ₂ᶜ minus a correction that vanishes as v₂ᶜ → 1; accurate when the conducting phase is the continuous one (case 2)."
  - id: sigma_eff
    name: Effective conductivity (estimate)
    symbol: "σ^c,*"
    unit: "1/(Ω*m)"
    kind: derived
    equation: phi*sigma_hi + (1 - phi)*sigma_lo
    description: "Convex combination of the bounds, eq. 5.10; this is the σ^c,* in ⟨J⟩_Ω = σ^c,*⟨E⟩_Ω (eq. 5.1)."
  - id: field_share
    name: Particles' share of the field
    symbol: "v₂ᶜC_E,2"
    unit: "1"
    kind: derived
    equation: (sigma_eff - sigma1)/(sigma2 - sigma1)
    description: "Phase-2 term of eq. 5.24, with C_E,2 = (σ^c,* − σ₁ᶜ)/(v₂ᶜ(σ₂ᶜ − σ₁ᶜ)) from eq. 5.30 scaling ⟨E⟩_Ω into ⟨E⟩_Ω₂ (C_E,2 ≈ 0.32 at the defaults); the binder's share is v₁ᶜC_E,1 = 1 − v₂ᶜC_E,2. v₂ᶜ acts on it only through σ^c,*."
  - id: current_share
    name: Particles' share of the current
    symbol: "v₂ᶜC_J,2"
    unit: "1"
    kind: derived
    equation: sigma2*(sigma_eff - sigma1)/(sigma_eff*(sigma2 - sigma1))
    description: "Phase-2 term of eqs. 5.23–5.24, with C_J,2 = σ₂ᶜC_E,2/σ^c,* (eq. 5.31) scaling ⟨J⟩_Ω into ⟨J⟩_Ω₂ (C_J,2 ≈ 3.05 at the defaults); the binder carries v₁ᶜC_J,1 = 1 − v₂ᶜC_J,2."
  - id: joule1
    name: Binder Joule factor
    symbol: "C_J,1C_E,1"
    unit: "1"
    kind: derived
    equation: sigma1*(sigma2 - sigma_eff)**2/(sigma_eff*((1 - v2)*(sigma2 - sigma1))**2)
    description: "Mean-field Joule heating intensity of the binder relative to ⟨J⟩·⟨E⟩: the product of eqs. 5.30 and 5.31, (σ₁ᶜ/σ^c,*)(1/v₁ᶜ²)((σ₂ᶜ − σ^c,*)/(σ₂ᶜ − σ₁ᶜ))² = (v₁ᶜC_J,1)(v₁ᶜC_E,1)/v₁ᶜ² (cf. eq. 5.32, printed with a single 1/v₁ᶜ); Π^elec compares it with TOL₁ (eq. 5.38). 0.16 at the defaults."
  - id: joule2
    name: Particle Joule factor
    symbol: "C_J,2C_E,2"
    unit: "1"
    kind: derived
    equation: sigma2*(sigma_eff - sigma1)**2/(sigma_eff*(v2*(sigma2 - sigma1))**2)
    description: "Mean-field Joule heating intensity of the particles relative to ⟨J⟩·⟨E⟩: the product of eqs. 5.30 and 5.31, (σ₂ᶜ/σ^c,*)(1/v₂ᶜ²)((σ^c,* − σ₁ᶜ)/(σ₂ᶜ − σ₁ᶜ))² = (v₂ᶜC_J,2)(v₂ᶜC_E,2)/v₂ᶜ² (cf. eq. 5.33, printed with a single 1/v₂ᶜ); Π^elec compares it with TOL₂ (eq. 5.38). 0.98 at the defaults, 1.29 after the −30 % v₂ᶜ shock; the explicit 1/v₂ᶜ² and the σ^c,* path pull in opposite directions."
dynamics:
  time: {unit: s, start: 0, end: 450, step: 0.05}
  rates:
    theta: (q_J - h_v*theta)/rho_cp
  integrator: rk4
events:
  - {id: limit, label: "Δθ = 100 K reached", when: "theta >= 100", once: true, description: "An illustrative allowable rise for the binder (not from the chapter): the lumped mixture passes it at 68 s. Π^elec guards against the same failure one level down — its TOL_i terms cap each phase's Joule factor C_J,iC_E,i, a ratio to ⟨J⟩·⟨E⟩, which this lumped model does not resolve in time."}
  - {id: current_off, label: "Current off", t: 200, sets: {J: 0}, description: "The drive is cut; Δθ_∞ drops to zero and the mixture cools with the same time constant ρc/h_v."}
  - {id: safe, label: "Below 100 K again", when: "theta <= 100 and t > 200", once: true, description: "Cooling with τ = ρc/h_v = 90 s brings the mixture back under the 100 K limit 47 s after the cut."}
  - {id: fewer_particles, label: "Particle fraction −30 % (shock)", shock: {v2: -0.3}}
invariants:
  - {label: "identity v₁ᶜC_E,1 + v₂ᶜC_E,2 ≡ 1 (eq. 5.18; a definition, not a conservation law)", expr: "(sigma2 - sigma_eff)/(sigma2 - sigma1) + field_share", tolerance: 1e-9}
  - {label: "identity v₁ᶜC_J,1 + v₂ᶜC_J,2 ≡ 1 (eq. 5.23; a definition, not a conservation law)", expr: "sigma1*(sigma2 - sigma_eff)/(sigma_eff*(sigma2 - sigma1)) + current_share", tolerance: 1e-9}
cascade:
  shock: {v2: -0.3}
  default_delay: 1
  damping: 1.0
  threshold: 0.02
  max_depth: 6
  time_unit: step
tree:
  kind: decision
  title: "Scoring one candidate mixture Λ with Π^total (§5.5–5.12): which terms are active"
  root:
    label: "Electrical: σ^c,* ≈ σ^c,*,Des? (w₁, eq. 5.38)"
    branches:
      - label: "yes"
        child:
          label: "Joule: C_J,iC_E,i ≤ TOL_i in both phases?"
          branches:
            - label: "yes"
              child:
                label: "Thermal: IK* ≈ IK*,Des and C_q,i ≤ TOL_i? (eq. 5.39)"
                branches:
                  - label: "yes"
                    child:
                      label: "Mechanical targets: κ*, μ* hit? (w₁, w₂)"
                      branches:
                        - label: "yes"
                          child:
                            label: "Stress concentrations: all C^σ ≤ TOL? (5.57–5.58)"
                            branches:
                              - label: "yes"
                                child: {label: "Π^total small: Λ kept among the top K (STEP 5)"}
                              - label: "no"
                                child: {label: "ŵ₃–ŵ₆ switch on for each C^σ > TOL"}
                        - label: "no"
                          child: {label: "w₁, w₂ terms of Π^mech grow"}
                  - label: "no"
                    child: {label: "w₁ and/or ŵ₂, ŵ₃ of Π^thermal grow"}
            - label: "no"
              child: {label: "ŵ₂/ŵ₃ = w₂/w₃: Π jumps; Λ ranks low, eliminated (STEP 5)"}
      - label: "no"
        child: {label: "w₁|σ^c,*,Des − σ^c,*|/σ^c,*,Des large; rank falls"}
  algorithms:
    - {name: decision, path: ["yes", "no"], intro: "Π^total = W₁Π^elec + W₂Π^thermal + W₃Π^mech (eq. 5.59) is one weighted sum evaluated once per string: every term is always summed, and each question only asks whether its term is zero. Here the mixture meets its conductivity target but a phase's Joule factor exceeds its tolerance (with TOL₂ = 1, C_J,2C_E,2 = 0.98 passes at the defaults and 1.29 fails after the −30 % v₂ᶜ shock), so ŵ₃ = w₃ adds a penalty and the string ranks low and is eliminated in STEP 5."}
    - {name: bfs, intro: "The same checks level by level: each level is one more term of the same sum, not a later stage. The GA uses no directional rules — it ranks the scalar Π^total, mates the nearest pairs, keeps the top K parents and their K offspring and adds M random strings (§5.12)."}
figures:
  - {type: variable_graph, title: "From phase properties to bounds, load shares, Joule factors and heating", caption: "Arrows run from cause to effect; a blue + means the effect rises with the cause and a red − that it falls, with the arrow's other inputs held fixed. v₂ᶜ reaches the load shares only through σ^c,*, while the Joule factors also carry an explicit 1/vᵢᶜ², so the direct v₂ᶜ → C_J,1C_E,1 arrow (+) and the total effect in the influence matrix (−0.41) differ in sign. The heating chain assumes a fixed drive current ⟨J⟩. Numbered arrows are explained in the key."}
  - {type: influence_matrix, title: "Elasticities of the mixture estimates at the defaults", caption: "Each cell is the % change in the column variable per 1 % increase of the row variable at the defaults, with all other inputs (φᶜ included) fixed. Blue cells: the effect rises with the cause; red cells: it falls; pale cells: weak (the same colours as the variable graph)."}
  - {type: timeline, title: "Joule heat-up, the 100 K limit, and cooling after the current is cut", series: [theta, theta_ss], caption: "Panel A (constructed for this figure, not a worked example of the chapter): at a fixed ⟨J⟩ = 20 kA/m² the mixture heats toward Δθ_∞ = 189 K with τ = ρc/h_v = 90 s, passes the illustrative 100 K limit at 68 s, and is back below it 47 s after the current is cut at 200 s. Panel B follows a −30 % cut in v₂ᶜ with φᶜ fixed; its sizes are linearised (shock × elasticity along each path), whereas the exact outcome is σ^c,* −30 %, Δθ_∞ +42 % and C_J,2C_E,2 +31 %."}
  - {type: scene3d, title: "Heating trajectory (depth in seconds) and the v₂ᶜ cascade (depth in hops, not seconds) in 3D"}
  - {type: tree, title: "Which terms of Π^total penalise one candidate mixture", algorithm: decision}
